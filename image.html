<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Image Styling Practice</title>

<style>
body {
    margin: 0;
    padding: 40px;
    background-color: #eee;
    display: flex;
    justify-content: space-around;
    align-items: center;
}

/* 共用圖片設定 */
img {
    display: block;
}

/* 左圖：圓角、不變形 */
.img-left {
    width: 33%;
    border-radius: 18px;
    object-fit: cover;   /* 保持比例 */
}

/* 中間：圓形圖片 */
.circle {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 5px solid gray;
    object-fit: cover;
}

/* 右圖：會變形 */
.img-right {
    width: 33%;
    height: 300px;
    object-fit: fill;   /* 故意讓它變形 */
}
</style>

</head>

<body>

<!-- 左圖 -->
<img src="https://picsum.photos/id/1011/600/400" class="img-left">

<!-- 中間圓形 -->
<img src="https://picsum.photos/id/1015/300/300" class="circle">

<!-- 右圖 -->
<img src="https://picsum.photos/id/1011/600/400" class="img-right">

</body>
</html>
