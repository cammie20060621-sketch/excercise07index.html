<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Image Styling Practice</title>
    <style>
        body {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 50px;
            font-family: Arial, sans-serif;
        }

        /* 共用基礎樣式 */
        img {
            height: 300px; /* 依照標記統一高度 */
        }

        /* 左側圖片：圓角、無變形、寬度33% */
        .img-left {
            width: 33%;
            border-radius: 18px; /* 設定 18px 圓角 */
            object-fit: cover;    /* 關鍵：防止圖片被擠壓變形 */
        }

        /* 中間圖片：正圓形、邊框、固定寬高 */
        .img-center {
            width: 150px;
            height: 150px;
            border-radius: 50%;   /* 設定 50% 達成正圓形 */
            border: 1px solid #333; /* 加上黑色邊框 */
            object-fit: cover;    /* 關鍵：防止圖片變形 */
        }

        /* 右側圖片：寬度33%、有變形 */
        .img-right {
            width: 33%;
            /* 注意：這裡不設定 object-fit，圖片會因為強迫設定寬度而產生 distortion (擠壓變形) */
        }
    </style>
</head>
<body>

    <img src="https://via.placeholder.com/600x800" alt="Paris" class="img-left">

    <img src="https://via.placeholder.com/400" alt="Mountain" class="img-center">

    <img src="https://via.placeholder.com/600x800" alt="Paris" class="img-right">

</body>
</html>
