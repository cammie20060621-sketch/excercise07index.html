<!DOCTYPE html>
<html lang ="en">
<head>
<meta charset=UTF-8>
<style>
body{
  background-color: #eee;
  font-family: "Time New Roman", serif;
}
.container{
  width: 500px;
  margin: 50px auto;
  padding: 20px;
  background: #f9f9f9;
  box-shadow: 5px 5px 10px gray;
}
.box1{
  background-color: #7fa6b8;
  border: 6px double red;
  padding: 10px;
  font-size: 40px;
  font-weight: bold;
}
.box2{
  background-color: yellow;
  border: 4px solid blue;
  border-radius: 15px;
  padding: 10px;
  margin-top: 20px;
  font-size: 40px;
  font-weight: bold;
}
.box3{
  background-color: seagreen;
  padding: 10px;
  margin-top: 20px;
  font-size: 40px;
  font-weight: bold;
    /* 點點邊框效果 */
  border: 10px dotted gray;

}
</style>
</head>
<body>
<div class="container">
    <div class="box1">Hello World</div>
    <div class="box2">Hello World</div>
    <div class="box3">Hello World</div>
</div>
</body>
</html>
