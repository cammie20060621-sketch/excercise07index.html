body {

}

/* 外框 */
.container {
    width: 600px;
    margin: 50px auto;
    padding: 20px;
    background: white;

/* Heading 1 */
.h1 {
    font-size: 40px;
    font-weight: bold;
    border-top: 4px solid black;

}

/* Heading 2 */
.h2 {
    font-size: 30px;
    font-style: italic;
    border: 3px solid yellow;
    outline: 1px solid black;
    padding: 5px;
    margin-bottom: 20px;
}

/* Heading 3 */
.h3 {
    text-align: right;
    font-size: 20px;
    font-weight: bold;
    border-bottem:4px solid black;
}
</style>
</head>

<body>

<div class="container">
    <div class="h1">This is heading 1</div>
    <div class="h2">This is heading 2</div>
    <div class="h3">This is heading 3</div>
</div>

</body>
