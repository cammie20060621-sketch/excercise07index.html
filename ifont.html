<!DOCTYPE html>
<html>
<head>
<mwta charset="UTF-8">
<style>
body {
    background-color: #eee;
    font-family: "Times New Roman", serif;
}

/* 外框 */
.container {
    width: 600px;
    margin: 50px auto;
    padding: 20px;
    background: white;
    box-shadow: 5px 5px 10px gray;
}

/* Heading 1 */
h1 {
    display: inline-block;   /* 讓寬度只等於文字 */
    position: relative;
    padding-top: 15px;
    text-shadow: 3px 3px pink;
}

/* 畫上方那條線 */
h1::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;             /* 跟文字一樣長 */
    height: 5px;
    background: black;
    box-shadow: 3px 3px pink;  /* 線的粉色陰影 */
}

/* Heading 2 */
.h2 {
    font-size: 30px;
    font-style: italic;
    border: 3px solid yellow;
    outline: 1px solid black;
    padding: 5px;
    margin-bottom: 20px;
}

/* Heading 3 */
h3 {
    display: inline-block;   /* 關鍵：寬度=文字 */
    position: relative;
    text-align: right;
    margin-top: 40px;
}

/* 底線 */
h3::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -5px;        /* 線在文字下面 */
    width: 100%;         /* 跟文字一樣長 */
    height: 3px;
    background: black;
}
</style>
</head>

<body>

<div class="container">
    <div class="h1">This is heading 1</div>
    <div class="h2">This is heading 2</div>
    <div class="h3">This is heading 3</div>
</div>

</body>
</html>
