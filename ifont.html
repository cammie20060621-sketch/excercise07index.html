<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
    background-color: #eee;
    font-family: "Times New Roman", serif;
}

/* 外框 */
.container {
    width: 600px;
    margin: 50px auto;
    padding: 20px;
    background: white;
    box-shadow: 5px 5px 10px gray;
}

/* Heading 1 */
h1 {
    border-top: 5px solid black;
    padding-top: 10px;
    margin-bottom: 20px;
    text-shadow: 3px 3px pink;
}

/* Heading 2 */
h2 {
    border: 3px solid yellow;
    outline: 1px solid black;
    padding: 10px;
    font-style: italic;
}

/* Heading 3 */
h3 {
    text-align: right;
    text-decoration: underline;
    margin-top: 40px;
}
</style>

</head>

<body>

<div class="container">
    <h1>This is heading 1</h1>
    <h2>This is heading 2</h2>
    <h3>This is heading 3</h3>
</div>

</body>
</html>
