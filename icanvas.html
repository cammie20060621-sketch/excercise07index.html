<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Shapes</title>

<style>

.container{
  position: relative;
  width: 400px;
  height: 250px;
}

.rectangle{
  width:200px;
  height:150px;
  background:blue;
  border:5px solid black;
  position:absolute;
  left:20px;
  top:40px;
}

.circle{
  width:150px;
  height:150px;
  background:yellow;
  border:10px solid red;
  border-radius:50%;
  position:absolute;
  left:120px;
  top:50px;
}

</style>

</head>

<body>

<div class="container">

<div class="rectangle"></div>

<div class="circle"></div>

</div>

</body>
</html>
