<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Image Styling Practice</title>
    <style>
        .container {
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 20px;
        }

        /* 共用設定：高度固定為 300px */
        img {
            height: 300px;
        }

        /* 左側圖片：圓角 18px，寬度 33%，不變形 */
        .img-left {
            width: 33%;
            border-radius: 18px;
            object-fit: cover; /* 關鍵：防止變形 */
        }

        /* 中間圖片：正圓形 150px，有外框 */
        .img-circle {
            width: 150px;
            height: 150px; /* 覆蓋全域的 300px，確保是正圓 */
            border-radius: 50%;
            border: 2px solid #333;
            object-fit: cover; /* 關鍵：防止變形 */
        }

        /* 右側圖片：寬度 33%，變形 (Distortion) */
        .img-right {
            width: 33%;
            /* 預設情況下，若同時強制指定寬高且比例不符，圖片就會變形 */
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://picsum.photos/800/800?random=1" alt="Eiffel Tower" class="img-left">

        <img src="https://picsum.photos/800/800?random=2" alt="Nature" class="img-circle">

        <img src="https://picsum.photos/800/800?random=1" alt="Eiffel Tower" class="img-right">
    </div>

</body>
</html>
